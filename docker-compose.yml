services:
  bambuboard:
    build: .
    image: ghcr.io/t0nyz0/bambuboard:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - BAMBUBOARD_HTTP_PORT=8080
      - BAMBUBOARD_PRINTER_NAME
      - BAMBUBOARD_PRINTER_TYPE
      - BAMBUBOARD_PRINTER_URL
      - BAMBUBOARD_PRINTER_PORT
      - BAMBUBOARD_PRINTER_SN
      - BAMBUBOARD_PRINTER_ACCESS_CODE
      - BAMBUBOARD_TEMP_SETTING
      - BAMBUBOARD_FAN_PERCENTAGES
      - BAMBUBOARD_FAN_ICONS
      - BAMBUBOARD_LOGGING
    volumes:
      - ./data:/usr/src/app/data
      - ./OBS_settings:/usr/src/app/OBS_settings
