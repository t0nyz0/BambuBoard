name: Validate pull request
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run test:browser
      - run: npm run test:gcode-browser
      - run: npm run test:stream-browser
      - run: npm run test:ui
        env:
          BB_BROWSERS: chromium,firefox,webkit
      - run: npm run test:cloud
        env:
          BB_BROWSERS: chromium,firefox,webkit
      - run: npm audit --audit-level=low
      - run: npm run build:vendor
      - run: git diff --exit-code -- public/vendor public/assets/js
  container:
    # Run capture/encoding checks on each architecture's native CPU rather
    # than measuring browser and video performance under QEMU emulation.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: bambuboard:test
      - name: Server integration tests inside the image
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --platform "$PLATFORM" --rm -v "$GITHUB_WORKSPACE/test:/usr/src/app/test:ro" bambuboard:test sh -ec 'apk add --no-cache openssl; node --test test/*.test.js'
      - name: Container startup and camera binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --platform "$PLATFORM" --rm bambuboard:test sh -ec '"$FFMPEG_BIN" -version; "$FFMPEG_BIN" -v error -f lavfi -i testsrc2=size=320x180:rate=15 -t 1 -c:v mpeg1video -r 30 -f mpegts /tmp/camera.ts; "$FFMPEG_BIN" -v error -f lavfi -i testsrc2=size=320x180:rate=15 -f lavfi -i anullsrc -t 1 -c:v libx264 -pix_fmt yuv420p -c:a aac -f flv /tmp/stream.flv; "$FFMPEG_BIN" -v error -i /tmp/camera.ts -f null -; "$FFMPEG_BIN" -v error -i /tmp/stream.flv -f null -'
          docker run --platform "$PLATFORM" -d --name bambuboard-test -p 8080:8080 bambuboard:test
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/api/status; then exit 0; fi
            sleep 2
          done
          docker logs bambuboard-test
          exit 1
      - name: Stop test container
        if: always()
        run: docker rm -f bambuboard-test || true
